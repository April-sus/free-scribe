name: CI

# The Windows job is the point of this file: the macOS app can be built and tested
# locally, but the Windows port cannot be, so CI is where that half gets verified.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the shared core
        working-directory: core
        run: swift test
      - name: Build the core for iOS
        working-directory: core
        # The iOS app depends on this package; if it stops compiling for iOS,
        # that break should surface here rather than in an app build later.
        run: |
          xcodebuild -scheme WhisperFlowCore \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios" build | tail -5
      - name: Build app bundle
        working-directory: macos
        # No signing identity on a runner, so build.sh falls back to ad-hoc.
        run: ./build.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check dependency licences
        working-directory: windows
        run: cargo deny --manifest-path Cargo.toml check licenses
      - name: Notices file generates
        run: ./scripts/generate-notices.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The port has not started, so there is nothing to build yet. Without this the
      # job is permanently red, which trains everyone to ignore a failing CI.
      - id: check
        shell: bash
        run: echo "exists=${{ hashFiles('windows/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.exists == 'true'
      - name: Generate third-party notices
        if: steps.check.outputs.exists == 'true'
        shell: bash
        # Not committed: generated from the resolved graph, and Tauri needs it
        # present because the bundle lists it as a resource.
        run: python3 scripts/generate-notices.py windows
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: windows
        run: cargo test

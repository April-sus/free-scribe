[package]
name = "free-scribe-translate"
description = "Local translation sidecar. Both apps spawn it and talk over stdin/stdout, which avoids linking a C++ library into a Swift package and keeps a crash here from taking the app with it."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ct2rs = "0.10"
sentencepiece = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
